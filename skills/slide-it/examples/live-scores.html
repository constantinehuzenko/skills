<script>
/* Two lanes, one per technology, so every frame compares them: a server, its pipe, and a phone with a live scoreboard and

  svgEl("rect", { x: x - w / 2, y: y - 13, width: w, height: 26, rx: 13, class: "face" }, g);
  var tx = svgEl("text", { x: x, y: y + 4.5, "text-anchor": "middle" }, g); tx.textContent = t;

}
/* A message on its way: a small pill in its colour. */

/* A pipe between the server and the phone: one filled arrow in the lane's tint, a rounded tail flowing into a pointed head.

  else d = "M" + (x1 - h) + " " + (y - h) + "H" + (x0 + head) + "V" + (y - H) + "L" + x0 + " " + y + "L" + (x0 + head) + " " + (y + H) + "V" + (y + h) + "H" + (x1 - h) + "A" + h + " " + h + " 0 0 0 " + (x1 - h) + " " + (y - h) + "Z";

/* One lane: title, server, pipe(s), phone, counter. */

  [21, 43].forEach(function (d) { svgEl("line", { x1: sx, y1: sy + d, x2: sx + sw, y2: sy + d, stroke: cv, "stroke-width": 1, "stroke-opacity": .3 }, svg); });
  [11, 32, 53].forEach(function (d) { svgEl("circle", { cx: sx + 11, cy: sy + d, r: 2.8, fill: cv }, svg);
    svgEl("line", { x1: sx + 21, y1: sy + d, x2: sx + sw - 10, y2: sy + d, stroke: cv, "stroke-width": 1.8, "stroke-opacity": .45, "stroke-linecap": "round" }, svg); });
  L.serverEl = text(svg, "server", sx + sw / 2, y0 + 168, { align: "middle", size: 11, weight: 600, color: "muted-foreground" });
  /* the pipes: SSE one way down; the WebSocket one each way */

  else { L.down = y0 + 119; pipe(svg, L.down, c); }

  L.count = text(svg, "1", 133, y0 + 213, { align: "middle", size: 14, weight: 800 });

  var px = PHX, py = y0 + 12, ph = 206, cx = px + PHW / 2, m = 9, iw = PHW - 2 * m;

function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
/* The engine eases each step; undo it so a move can use its own ease. */

var SCENES = {
  /* Next and Back drive it. 1 the setup: two fans, two lines, 1 request each · 2 a goal goes down both at once ·

    tween: 2400,

        A.count.textContent = posted ? "2" : "1"; A.count.setAttribute("fill", "var(--" + (posted ? "chart-1" : "foreground") + ")");
