<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- standalone only: drop this line when pasting into a page that has its own -->
<!-- slide-it kit / theme-toggle: the token block every other snippet assumes + a light/dark toggle.
     Paste ONCE per page, before the other snippets. A style file restyles the whole page by overriding these tokens
     (bare :root = light; the media block AND [data-theme="dark"] = dark). Default values are neutral on purpose. -->
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--fg:#14161a;--muted:#5b6270;--line:#dfe2e8;
  --accent:#3b5bdb;--accent-fg:#ffffff;--good:#1b7f4b;--warn:#a15c00;--bad:#c0392b;
  --font-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:10px;
  --dur-fast:150ms;--dur:240ms;--dur-slow:420ms;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#181b21;--fg:#eceef2;--muted:#9aa1ae;--line:#2a2f38;
  --accent:#8ea2ff;--accent-fg:#0b0d12;--good:#4cc38a;--warn:#e0a03c;--bad:#ff7b6e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#181b21;--fg:#eceef2;--muted:#9aa1ae;--line:#2a2f38;
  --accent:#8ea2ff;--accent-fg:#0b0d12;--good:#4cc38a;--warn:#e0a03c;--bad:#ff7b6e;
  color-scheme:dark;
}
/* Page base at zero specificity, so any page rule wins. */
:where(body){margin:0 auto;padding:16px;max-width:40rem;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body)}

.si-theme-toggle{--si-m:1;--si-t:calc(var(--dur)*var(--si-m));--si-tf:calc(var(--dur-fast)*var(--si-m));
  display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform var(--si-tf) var(--ease-out),border-color var(--dur-fast)}
.si-theme-toggle:active{transform:scale(.94)}
.si-theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.si-theme-toggle:hover{border-color:var(--muted)}}
.si-theme-toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.si-theme-sun,.si-theme-moon{transform-box:fill-box;transform-origin:center;
  transition:transform var(--si-t) var(--ease-out),opacity var(--dur) var(--ease-out)}
.si-theme-toggle[data-mode="light"] .si-theme-moon,.si-theme-toggle[data-mode="dark"] .si-theme-sun{opacity:0;transform:rotate(-70deg) scale(.5)}
@media (prefers-reduced-motion:reduce){.si-theme-toggle{--si-m:0}.si-theme-toggle:active{transform:none}}
/* While the theme flips, nothing may fade: the whole page changes in one frame. */
.si-theme-switching,.si-theme-switching *,.si-theme-switching *::before,.si-theme-switching *::after{transition:none!important}
</style>

<button type="button" class="si-theme-toggle" data-mode="light" aria-label="Switch to dark theme" title="Switch theme">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <g class="si-theme-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>
    <path class="si-theme-moon" d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/>
  </svg>
</button>

<script>
(function(){
  var KEY='si.theme',root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)'),
      btns=[].slice.call(document.querySelectorAll('.si-theme-toggle:not([data-si-ready])'));
  function saved(){try{var v=localStorage.getItem(KEY);return v==='light'||v==='dark'?v:null}catch(e){return null}}
  function mode(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light')}
  function paint(){var m=mode();btns.forEach(function(b){b.dataset.mode=m;b.setAttribute('aria-label','Switch to '+(m==='dark'?'light':'dark')+' theme')})}
  var s=saved();if(s)root.setAttribute('data-theme',s);          /* nothing saved: follow the system */
  btns.forEach(function(b){
    b.setAttribute('data-si-ready','');
    b.addEventListener('click',function(){
      var n=mode()==='dark'?'light':'dark';
      root.classList.add('si-theme-switching');root.setAttribute('data-theme',n);void root.offsetWidth;   /* restyle with transitions off */
      root.classList.remove('si-theme-switching');
      try{localStorage.setItem(KEY,n)}catch(e){}
      paint();
    });
  });
  if(mq.addEventListener)mq.addEventListener('change',paint);
  paint();
})();
</script>
