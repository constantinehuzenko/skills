    function at3(p,z){return[p[0],p[1],z]}

    /* ---------- phones: lying on a pad, screen up ---------- */
    function phone(pad,towardPlus){
      var body={x:pad.x+7,y:pad.y+4,w:30,d:58,r:6},scr=K.insetPlan(body,2),o=[];
      o.push('<path class="iso-halo" d="'+K.haloOf(pad,0,4,P)+'"/>');
      o.push(solid(slab(pad,0,4,6,.8),{tone:'lo'}));
      o.push(solid(slab(body,4,3,7,.7),{tone:'hi',crease:'lo'}));
      [14,24].forEach(function(dy){o.push(solid(slab({x:body.x+body.w,y:body.y+dy,w:1.2,d:7,r:.5},5.2,1.6,2),{tone:'mid',crease:'none'}))});
      o.push(solid(slab(scr,7,.4,5),{tone:'mid',crease:'none',className:'si-isof-screen'}));
      o.push(solid(slab({x:body.x+11,y:body.y+4.2,w:8,d:2.2,r:1.1},7.4,.4,3),{tone:'lo',crease:'none'}));
      var z=7.4,bw=16,bd=11,
          mine={x:towardPlus?scr.x+scr.w-3-bw:scr.x+3,y:scr.y+(towardPlus?10:14),w:bw,d:bd,r:2.6},
          ghost={x:towardPlus?scr.x+3:scr.x+scr.w-3-12,y:scr.y+32,w:12,d:7,r:2.2};
      o.push(line(K.planOutline(ghost,z,P,4),{tone:'lo'}));
      o.push(line(K.lineOnTop([ghost.x+2.4,ghost.y+3.5],[ghost.x+ghost.w-2.4,ghost.y+3.5],z,P),{tone:'lo',free:true}));
      var bub=[solid(slab(mine,z,.5,4),{tone:'hi',crease:'lo'}),
        line(K.lineOnTop([mine.x+2.4,mine.y+3],[mine.x+mine.w-2.4,mine.y+3],z+.5,P),{tone:'mid',free:true}),
        line(K.lineOnTop([mine.x+2.4,mine.y+5.6],[mine.x+mine.w-6,mine.y+5.6],z+.5,P),{tone:'mid',free:true})].join('');
      var tx=mine.x+mine.w-7.6,ty=mine.y+8.7,tick=function(dx){return K.onTop([[tx+dx,ty],[tx+dx+1.1,ty+1.2],[tx+dx+3,ty-1.3]],z+.5,P)},
          ticks=line(tick(0)+tick(2.2),{tone:'lit',free:true});
      return{base:o.join(''),bubble:bub,ticks:ticks};
    }
    var A=phone(PA,false),B=phone(PB,true);

    /* ---------- the server rack ---------- */
    function rack(){
      var o=[],zf=19.4;
      o.push('<path class="iso-halo" d="'+K.haloOf(PL,0,5,P)+'"/>');
      o.push(solid(slab(PL,0,5,6,.8),{tone:'lo'}));
      o.push(K.faceTextSvg(K.sideMatrix([-21,23],1.4,P,'left'),'SERVER',{size:2.6,tone:'mid'}));
      var seams=[26.5,45.5,64.5].map(function(z){return line(K.sideSeam(CB,z,P,4),{tone:'faint'})}).join('');
      o.push(solid(slab(CB,5,81,4,1.2),{tone:'mid',crease:'lo',inner:seams}));
      o.push(K.dotsSvg(K.dotGrid(-12,-9,7,4,4,86,P),{size:.5,tone:'lo'}));
      var drawers=UNITS.map(function(z0,i){
        var zm=z0+UNIT_H/2,s=[],plan={x:-17,y:17,w:34,d:2.4,r:.6};
        var d=solid(slab(plan,z0,UNIT_H,2,.4),{tone:'hi',crease:'lo'});
        if(i===0)[-14,-9.5,-5].forEach(function(x){s.push(line(K.sideRing([x,zf,zm],1.5,'y',P,14),{tone:'mid'}))});
        else{var v=[];[-2.2,2.2].forEach(function(dz){[-14,-10.7,-7.4,-4.1].forEach(function(x){v.push([x,zf,zm+dz])})});s.push(K.dotsSvg(K.pointsAt(v,P),{size:.45,tone:'lo'}))}
        s.push(solid(slab({x:0,y:zf,w:7,d:1.2,r:.5},zm-1,2,2),{tone:'mid',crease:'none'}));
        s.push('<g class="si-led" data-led="'+i+'">'+K.dotsSvg(K.pointsAt([[11,zf,zm],[14.4,zf,zm]],P),{size:.8,tone:'mid',pulse:i!==2})+'</g>');
        return i===2?part('drawer',d,{})+s.join(''):d+s.join('');
      });
      return o.join('')+drawers.join('');
    }

    /* ---------- the time ruler on the desk's front edge ---------- */
    var MS_MAX=120,X0=-80,X1=80,msX=function(ms){return X0+Math.min(MS_MAX,ms)*(X1-X0)/MS_MAX};
    var ticks=K.topTicks(X0,X1,(X1-X0)/MS_MAX*4,5,STRIP.y+.8,.6,[2,3.6],P);
    var marker='<g data-part="marker">'+line(K.lineOnTop([0,STRIP.y+.5],[0,STRIP.y+STRIP.d-.5],.6,P),{tone:'lit'}).replace('class="iso-line"','class="iso-line" style="stroke-width:1.3px"')+'</g>';

    /* ---------- the packet: an envelope-sized lit solid built at the origin and moved with translateAlong ---------- */
    var PK={x:-5,y:-3.6,w:10,d:7.2,r:1.8},PK_Z=DUCT_H,PK_H=3.6;
    var packet='<g data-part="packet">'+'<path class="iso-halo" d="'+K.haloOf(PK,PK_Z,PK_H,P)+'"/>'+
      solid(slab(PK,PK_Z,PK_H,3,.4),{tone:'hi',lit:true,crease:'lo'})+
      line(K.onTop([[-3.6,-2.2],[0,.6],[3.6,-2.2]],PK_Z+PK_H,P),{tone:'lit'})+'</g>';

    /* ---------- put it together, back to front ---------- */
    var plug=function(plan){return solid(slab(plan,DUCT_H,2.4,3,.3),{tone:'mid',crease:'lo'})};
    var wire=function(pts,name){
      var q=K.pointsAt(pts.map(function(p){return at3(p,DUCT_H)}),P);
      return'<g data-part="'+name+'">'+K.wireSvg(q[0],q[q.length-1],{via:q.slice(1,-1),tone:'lo',dotted:true})+'</g>';
    };
    var devices=[{c:[-58,58],svg:A.base+part('bubbleA',A.bubble)},{c:[0,0],svg:rack()},{c:[58,-58],svg:B.base+part('bubbleB',B.bubble)+part('ticksB',B.ticks)}]
      .sort(function(a,b){return K.depthOf([a.c[0],a.c[1],0],P)-K.depthOf([b.c[0],b.c[1],0],P)});
    var body=[
      '<path class="iso-halo" d="'+K.haloOf(DESK,-8,8,P)+'"/>',
      solid(slab(DESK,-8,8,10,1.2),{tone:'lo',crease:'faint'}),
      line(K.planOutline(K.insetPlan(DESK,6),0,P,8),{tone:'faint'}),
      solid(slab(STRIP,0,.6,3),{tone:'lo',crease:'none'}),
      line(ticks.minor,{tone:'lo'}),line(ticks.major,{tone:'mid'}),marker,
      devices.map(function(d){return d.svg}).join(''),
      solid(K.extrude(ductRing(DUCT1,DUCT_W),0,DUCT_H,P,{convex:false}),{tone:'mid',crease:'faint'}),
      solid(K.extrude(ductRing(DUCT2,DUCT_W),0,DUCT_H,P,{convex:false}),{tone:'mid',crease:'faint'}),
      wire(WIRE1,'wire1'),wire(WIRE2,'wire2'),
      plug({x:-36,y:55.5,w:5.5,d:5,r:1}),plug({x:-2.5,y:23,w:5,d:5.5,r:1}),plug({x:26,y:-2.5,w:5.5,d:5,r:1}),plug({x:55.5,y:-25,w:5,d:5.5,r:1}),
      packet
    ].join('');
    root.querySelector('.si-isof-stage').innerHTML=K.plateHtml({fig:'FIG. 01',title:'Message path',hint:'← → to step',readout:'',
      body:K.figureSvg({width:W,height:H,label:'Isometric figure on one desk: a phone on the left, a server rack in the middle and a second phone on the right, joined by cable ducts. A message packet travels from the first phone to the server and on to the second phone.',body:body})});

    /* ---------- state: one number, v, says where the message is ---------- */
    /* v 0..1 on cable 1 (phone A to the server), 1..1.2 inside the rack, 1.2..2.2 on cable 2, 2.2..2.3 into phone B */
    var R_IN=1,R_OUT=1.2,B_IN=2.2,B_END=2.3,
        PH=[0.4,R_OUT,B_IN,B_END],
        MS=[[0,0],[1,22],[1.2,48],[2.2,96],[2.3,96]],
        $=function(n){return root.querySelector('[data-part="'+n+'"]')},
        el={packet:$('packet'),marker:$('marker'),b:$('bubbleB'),ticks:$('ticksB'),w1:$('wire1'),w2:$('wire2'),drawer:$('drawer'),ba:$('bubbleA')},
        leds=[].slice.call(root.querySelectorAll('.si-led')),
        readout=root.querySelector('[data-readout]'),cap=root.querySelector('.si-isof-cap'),
        btns=[].slice.call(root.querySelectorAll('.si-isof-seg button'));
    var lerp=function(a,b,t){return a+(b-a)*t},clamp=function(x,a,b){return Math.min(b,Math.max(a,x))},ramp=function(x,a,b){return clamp((x-a)/(b-a),0,1)};
    function ms(v){for(var i=1;i<MS.length;i++)if(v<=MS[i][0]||i===MS.length-1)return lerp(MS[i-1][1],MS[i][1],ramp(v,MS[i-1][0],MS[i][0]))}
    function along(path,s){var cum=[],tot=0,i;for(i=1;i<path.length;i++){tot+=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);cum.push(tot)}
      var d=clamp(s,0,1)*tot,prev=0;for(i=0;i<cum.length;i++){if(d<=cum[i]||i===cum.length-1){var t=(d-prev)/(cum[i]-prev||1);return[lerp(path[i][0],path[i+1][0],t),lerp(path[i][1],path[i+1][1],t)]}prev=cum[i]}}
    function where(v){return v<=R_IN?along(ROUTE1,v):v<R_OUT?along(ROUTE1,1):along(ROUTE2,(v-R_OUT)/(B_IN-R_OUT))}
    function seen(v){return ramp(v,0,.06)*(1-ramp(v,.94,R_IN))+ramp(v,1.22,1.28)*(1-ramp(v,B_IN,B_END))}
    function holder(v){return v<.5?'a':(v>=.95&&v<=1.25)?'s':v>=2.1?'b':null}

    var ph=0,v=PH[0],last=0,clock=0,frame=0,visible=true,touring=!still.matches,tour=0,flashAt=-9,heldBy='',wires=[null,null],shown={};
    function setLit(){
      var h=holder(v);if(h===heldBy)return;
      if(h==='s'&&heldBy!=='s')flashAt=clock;
      heldBy=h;
      [['a',el.ba],['s',el.drawer],['b',el.b]].forEach(function(p){var g=p[1].querySelector('.iso-solid');if(g)g.toggleAttribute('data-lit',p[0]===h)});
      leds[2].classList.toggle('is-on',h==='s');
    }
    function flow(i,on){
      if(wires[i]===on)return;wires[i]=on;
      var g=i?el.w2:el.w1,w=g.firstElementChild,l=w.querySelector('.iso-line');
      w.setAttribute('data-tone',on?'lit':'lo');l.setAttribute('data-tone',on?'lit':'lo');
      if(on){l.removeAttribute('data-dotted');l.setAttribute('data-flow','')}else{l.removeAttribute('data-flow');l.setAttribute('data-dotted','')}
    }
    function draw(){
      var p=where(v),o=seen(v);
      el.packet.setAttribute('transform',K.translateAlong(P,[p[0],p[1],0]));el.packet.style.opacity=o.toFixed(3);
      el.marker.setAttribute('transform',K.translateAlong(P,[msX(ms(v)),0,0]));
      el.b.style.opacity=ramp(v,2.05,2.12).toFixed(3);el.ticks.style.opacity=ramp(v,2.24,2.29).toFixed(3);
      setLit();flow(0,v>.02&&v<R_IN-.02);flow(1,v>R_OUT+.02&&v<B_END-.02);
      var f=K.burst(clock-flashAt,.08,.4);leds[2].querySelectorAll('circle').forEach(function(c){c.setAttribute('r',(.8+1.1*f).toFixed(2))});
      var hop=v<R_IN?1:v<=R_OUT+.02?2:3,t='Hop '+hop+' of 3 · '+Math.round(ms(v))+' ms'+(v>B_IN+.07?' · read':'');
      if(t!==shown.t){shown.t=t;readout.textContent=t}
    }
    function tick(now){
      var dt=last?Math.min((now-last)/1000,1/30):1/60;last=now;clock+=dt;
      v=K.follow(v,PH[ph],dt,.25,still.matches);draw();
      frame=visible&&(v!==PH[ph]||clock-flashAt<1.2)?requestAnimationFrame(tick):0;
    }
    function kick(){if(!frame&&visible){last=0;frame=requestAnimationFrame(tick)}}
    function go(i,auto){
      i=(i+btns.length)%btns.length;var changed=i!==ph;ph=i;
      btns.forEach(function(b,k){b.setAttribute('aria-checked',k===i);b.tabIndex=k===i?0:-1});
      cap.setAttribute('aria-live',auto?'off':'polite');
      cap.innerHTML='<b>'+(i+1)+' of '+btns.length+' · '+btns[i].textContent+'</b>';cap.appendChild(document.createTextNode(btns[i].dataset.say));
      if(changed){cap.classList.remove('is-new');void cap.offsetWidth;cap.classList.add('is-new')}
      if(still.matches){v=PH[i];draw()}else kick();
    }
    function stopTour(){touring=false;clearTimeout(tour)}
    function nextTour(){if(!touring)return;if(visible)go(ph+1,true);tour=setTimeout(nextTour,2600)}
    btns.forEach(function(b,i){b.addEventListener('click',function(){stopTour();go(i)})});
    root.querySelector('.si-isof-seg').addEventListener('keydown',function(e){
      if(e.altKey||e.ctrlKey||e.metaKey)return;var k=e.key,to=k==='ArrowRight'||k==='ArrowDown'?ph+1:k==='ArrowLeft'||k==='ArrowUp'?ph-1:k==='Home'?0:k==='End'?btns.length-1:-1;
      if(to<0)return;e.preventDefault();stopTour();go(to);btns[ph].focus();
    });
    root.addEventListener('pointerdown',stopTour);
    if('IntersectionObserver'in window)new IntersectionObserver(function(en){visible=en[en.length-1].isIntersecting;if(visible)kick()},{rootMargin:'120px 0px'}).observe(root);
    go(0,true);v=PH[0];draw();
    if(touring)tour=setTimeout(nextTour,2200);
  });
})();
</script>
